<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="50%" stop-color="#F15A24"/>
      <stop offset="100%" stop-color="#D93800"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F15A24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge / Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#orangeGrad)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Athletic Track Stripes (Subtle background) -->
  <path d="M 60 420 L 420 60" stroke="url(#trackGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 120 460 L 460 120" stroke="url(#trackGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Glow effect for orange core -->
  <g filter="url(#glow)">
    <!-- Top-Right Diagonal Chevron / Upper arm of K -->
    <path d="M 270 248 L 396 112 C 404 104 416 108 418 119 L 426 166 C 428 176 423 186 414 193 L 316 280 Z" fill="url(#orangeGrad)" opacity="0.4"/>
  </g>

  <!-- Athletic Dynamic Monogram "K" -->
  <!-- Left Pillar / Speed Bar (Crisp Athletic White) -->
  <path d="M 174 102 C 166 102 159 107 157 115 L 118 395 C 116 405 124 414 134 414 L 186 414 C 194 414 201 409 203 401 L 242 121 C 244 111 236 102 226 102 Z" fill="#FFFFFF"/>

  <!-- Upper Arm of K: Forward-surging Speed Blade (Blazing Orange) -->
  <path d="M 252 242 L 388 106 C 395 99 407 103 409 113 L 417 158 C 419 167 415 176 407 182 L 298 274 Z" fill="url(#orangeGrad)"/>

  <!-- Lower Arm of K: Athletic Sprint Chevron (Blazing Orange) -->
  <path d="M 282 258 L 396 390 C 403 398 399 410 388 412 L 340 414 C 331 414 323 410 318 403 L 230 292 Z" fill="url(#orangeGrad)"/>

  <!-- Energy Spark / Star in Top-Right Corner -->
  <path d="M 424 76 Q 424 98 444 98 Q 424 98 424 120 Q 424 98 404 98 Q 424 98 424 76 Z" fill="#FFA726"/>
  <circle cx="424" cy="98" r="3.5" fill="#FFFFFF"/>
</svg>